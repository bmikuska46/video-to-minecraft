name: video-to-minecraft

services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: vtm, POSTGRES_USER: vtm, POSTGRES_PASSWORD: vtm}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtm -d vtm"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [redis-data:/data]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/video-to-minecraft"]

  api:
    build:
      context: ..
      dockerfile: infra/containers/api.Dockerfile
    environment: &service-environment
      VTM_DATABASE_URL: postgresql+psycopg://vtm:vtm@postgres:5432/vtm
      VTM_CELERY_BROKER_URL: redis://redis:6379/0
      VTM_S3_ENDPOINT_URL: http://minio:9000
      VTM_S3_PUBLIC_ENDPOINT_URL: ${VTM_S3_PUBLIC_ENDPOINT_URL:-}
      VTM_S3_ACCESS_KEY_ID: minioadmin
      VTM_S3_SECRET_ACCESS_KEY: minioadmin
      VTM_WORLDGEN_MANIFEST_KEY: ${VTM_WORLDGEN_MANIFEST_KEY:-development-only-change-this-key-32-bytes}
      # Pre-export check against the full crop-box volume, a loose upper bound for
      # uncut room scans; override locally in infra/.env to allow larger rooms.
      VTM_BLOCK_COUNT_HARD_LIMIT: ${VTM_BLOCK_COUNT_HARD_LIMIT:-5000000}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    ports: ["8000:8000"]

  pipeline-worker:
    build:
      context: ..
      dockerfile: infra/containers/reconstruction.Dockerfile
    environment:
      <<: *service-environment
      # The worker passes this to world generation as the cap on blocks actually
      # placed (worldgen accepts at most 5,000,000), so it keeps its own value.
      VTM_BLOCK_COUNT_HARD_LIMIT: "5000000"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    depends_on:
      api: {condition: service_started}
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: 1, capabilities: [gpu]}
    volumes:
      - ..:/workspace:ro
      - pipeline-work:/work/pipeline
      - ${VTM_PAPER_JAR_PATH:-./paper/paper-26.2-build.112-stable.jar}:/opt/paper/paper-26.2-build.112-stable.jar:ro

  # World generation (voxelizer + Paper) runs here, so an export never waits
  # behind a GPU reconstruction on pipeline-worker. Same image, no GPU.
  export-worker:
    build:
      context: ..
      dockerfile: infra/containers/reconstruction.Dockerfile
    command: ["celery", "-A", "app.pipeline:celery_app", "worker", "--loglevel=INFO", "--concurrency=1",
              "-Q", "export", "--hostname", "export@%h"]
    environment:
      <<: *service-environment
      VTM_BLOCK_COUNT_HARD_LIMIT: "5000000"
      VTM_WORKER_ROLE: export
    depends_on:
      api: {condition: service_started}
    volumes:
      - ..:/workspace:ro
      - pipeline-work:/work/pipeline
      - ${VTM_PAPER_JAR_PATH:-./paper/paper-26.2-build.112-stable.jar}:/opt/paper/paper-26.2-build.112-stable.jar:ro

volumes:
  minio-data:
  pipeline-work:
  postgres-data:
  redis-data:
