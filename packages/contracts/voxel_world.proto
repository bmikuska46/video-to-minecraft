syntax = "proto3";

package minecraft_video.contracts.v1;

option java_package = "dev.minecraftvideo.contracts.v1";
option java_multiple_files = true;
option java_outer_classname = "VoxelWorldProto";

// Stable, language-neutral handoff from reconstruction to world generation.
message VoxelWorld {
  uint32 schema_version = 1;
  string minecraft_version = 2;
  repeated PaletteEntry palette = 3;
  repeated Voxel voxels = 4;
  Bounds bounds = 5;
}

message PaletteEntry {
  uint32 id = 1;
  string block_state = 2;
}

message Voxel {
  sint32 x = 1;
  sint32 y = 2;
  sint32 z = 3;
  uint32 palette_id = 4;
}

message Bounds {
  sint32 min_x = 1;
  sint32 min_y = 2;
  sint32 min_z = 3;
  sint32 max_x = 4;
  sint32 max_y = 5;
  sint32 max_z = 6;
}
